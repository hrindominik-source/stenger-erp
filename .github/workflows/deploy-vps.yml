name: Build & deploy to VPS

# main -> produkcni image + deploy na produkcni kontejner (port 8080)
# develop -> vyvojovy image + deploy na vyvojovy kontejner (port 8081)
#
# Build probiha VZDY v GitHub Actions (ne na VPS) - VPS jen stahuje uz
# hotovy image z GHCR a restartuje kontejner. VPS tak nikdy nepotrebuje
# spoustet npm/vite build, staci mu Docker.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.vars.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=development" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ steps.vars.outputs.env_name == 'production' && secrets.VITE_SUPABASE_URL_PRODUCTION || secrets.VITE_SUPABASE_URL_DEVELOPMENT }}
            VITE_SUPABASE_ANON_KEY=${{ steps.vars.outputs.env_name == 'production' && secrets.VITE_SUPABASE_ANON_KEY_PRODUCTION || secrets.VITE_SUPABASE_ANON_KEY_DEVELOPMENT }}
            VITE_APP_ENV=${{ steps.vars.outputs.env_name }}
          tags: |
            ghcr.io/stenger-cz/stenger-erp:${{ steps.vars.outputs.env_name }}
            ghcr.io/stenger-cz/stenger-erp:${{ steps.vars.outputs.env_name }}-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/stenger-erp
            git pull
            docker compose -f docker-compose.deploy.${{ needs.build-and-push.outputs.env_name }}.yml pull
            docker compose -f docker-compose.deploy.${{ needs.build-and-push.outputs.env_name }}.yml up -d
            docker image prune -f
