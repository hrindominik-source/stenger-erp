# Obsluha statickej SPA (Vite build) - vsetky neznáme cesty spadnu na
# index.html (klientske smerovanie v ramci appky), staticke assety s hashom
# v nazve (Vite) sa smu cachovat agresivne, index.html nie (aby sa nova verzia
# po deploy prejavila hned, nie az po vyprsani cache).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
