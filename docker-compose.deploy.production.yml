# Pouziva se na VPS - NEBUILDUJE nic lokalne, jen stahne uz hotovy image
# postaveny v GitHub Actions (viz .github/workflows/deploy-vps.yml).
# Pro lokalni build+test pouzijte misto toho docker-compose.production.yml.
services:
  app-production:
    image: ghcr.io/stenger-cz/stenger-erp:production
    ports:
      - "8080:80"
    restart: unless-stopped
